<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级密码抽奖系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #f5f6fa;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .title::after {
            content: "";
            width: 80px;
            height: 4px;
            background: #764ba2;
            display: block;
            margin: 10px auto;
            border-radius: 2px;
        }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 8px;
            background: #764ba2;
            color: white;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #667eea;
        }

        .btn-danger {
            background: #ff4757;
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .nav button {
            font-size: 17px;
            padding: 11px 24px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        input {
            padding: 10px 14px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            width: 100%;
            margin-bottom: 14px;
        }

        input:focus {
            border-color: #764ba2;
        }

        .card {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h3 {
            margin-bottom: 15px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #f5f5f5;
        }

        .lottery-box {
            text-align: center;
            padding: 40px 20px;
            border: 2px dashed #764ba2;
            border-radius: 16px;
            margin: 20px 0;
        }

        #result {
            font-size: 26px;
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 20px;
            min-height: 40px;
        }

        #allPrizes {
            margin-top: 15px;
            font-size: 16px;
            color: #333;
            line-height: 1.6;
        }

        .admin-login {
            max-width: 400px;
            margin: 40px auto;
            text-align: center;
        }

        .flex {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 14px;
        }

        .flex-1 {
            flex: 1;
        }

        #chartContainer {
            height: 300px;
            margin: 20px 0;
        }

        .tip {
            color: #ff4757;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title"><i class="fas fa-gift"></i> 密码抽奖系统</h1>

    <!-- 导航 -->
    <div class="nav">
        <button class="btn" onclick="goPage('user')">前台抽奖</button>
        <button class="btn" onclick="goPage('adminLogin')">后台管理</button>
    </div>

    <!-- 前台页面 -->
    <div id="userPage" class="page active">
        <div class="card">
            <h3><i class="fas fa-user"></i> 抽奖区</h3>
            <input type="text" id="lotteryPwd" placeholder="请输入抽奖密码">
            <button class="btn" onclick="getChance()">验证密码，开始抽奖</button>
            <div class="lottery-box">
                <div id="result">请输入密码抽奖</div>
                <div id="allPrizes"></div>
                <button class="btn" onclick="doLottery()" id="lotteryBtn" disabled>开始抽奖</button>
            </div>
            <div class="tip" id="tip"></div>
        </div>
    </div>

    <!-- 后台登录 -->
    <div id="adminLoginPage" class="page">
        <div class="admin-login">
            <h3>管理员登录</h3>
            <input type="password" id="adminPwd" placeholder="请输入密码">
            <button class="btn" onclick="adminLogin()">登录</button>
        </div>
    </div>

    <!-- 后台管理 -->
    <div id="adminPage" class="page">
        <div class="nav">
            <button class="btn" onclick="goPage('prize')">奖品管理</button>
            <button class="btn" onclick="goPage('pwd')">密码管理</button>
            <button class="btn" onclick="goPage('bg')">背景设置</button>
            <button class="btn" onclick="goPage('chart')">概率图表</button>
        </div>

        <!-- 奖品管理 -->
        <div id="prizePage" class="page active">
            <div class="card">
                <h3><i class="fas fa-trophy"></i> 奖品设置（仅概率）</h3>
                <div class="flex">
                    <input type="text" id="prizeName" placeholder="奖品名称" class="flex-1">
                    <input type="number" id="prizeRate" placeholder="中奖概率 %" class="flex-1">
                    <button class="btn" onclick="addPrize()">添加</button>
                </div>
                <div id="prizeList"></div>
            </div>
        </div>

        <!-- 密码管理 -->
        <div id="pwdPage" class="page">
            <div class="card">
                <h3><i class="fas fa-key"></i> 抽奖密码管理</h3>
                <button class="btn" onclick="createPwd()">生成新密码</button>
                <div id="pwdList"></div>
            </div>
        </div>

        <!-- 背景设置 -->
        <div id="bgPage" class="page">
            <div class="card">
                <h3><i class="fas fa-image"></i> 前台背景设置</h3>
                <input type="text" id="bgUrl" placeholder="输入图片直链 URL">
                <button class="btn" onclick="setBackground()">应用背景</button>
            </div>
        </div>

        <!-- 概率图表 -->
        <div id="chartPage" class="page">
            <div class="card">
                <h3><i class="fas fa-chart-pie"></i> 中奖概率分布</h3>
                <div id="chartContainer">
                    <canvas id="rateChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ====================== 全局数据 ======================
    const ADMIN_PWD = "1212";
    let defaultPrizes = [
        { name: "一等奖", rate: 5 },
        { name: "二等奖", rate: 15 },
        { name: "三等奖", rate: 30 },
        { name: "谢谢参与", rate: 50 }
    ];
    
    let prizes = JSON.parse(JSON.stringify(defaultPrizes));
    let passwords = []; // { code, count, used }
    let currentChance = 0;
    let userPrizes = [];
    let bgImage = "";

    // ====================== 页面切换 ======================
    function goPage(page) {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        if (page === "user") document.getElementById("userPage").classList.add("active");
        if (page === "adminLogin") document.getElementById("adminLoginPage").classList.add("active");
        if (page === "prize") { document.getElementById("adminPage").classList.add("active"); document.getElementById("prizePage").classList.add("active"); }
        if (page === "pwd") { document.getElementById("adminPage").classList.add("active"); document.getElementById("pwdPage").classList.add("active"); renderPwd(); }
        if (page === "bg") { document.getElementById("adminPage").classList.add("active"); document.getElementById("bgPage").classList.add("active"); }
        if (page === "chart") { document.getElementById("adminPage").classList.add("active"); document.getElementById("chartPage").classList.add("active"); drawChart(); }
    }

    // ====================== 管理员登录 ======================
    function adminLogin() {
        if (document.getElementById("adminPwd").value === ADMIN_PWD) {
            goPage("prize"); renderPrize(); alert("登录成功");
        } else alert("密码错误");
    }

    // ====================== 前台：获取抽奖次数 ======================
    function getChance() {
        const code = document.getElementById("lotteryPwd").value.trim();
        const find = passwords.find(p => p.code === code);
        
        if (!find) { alert("密码无效"); return; }
        if (find.used) { alert("密码已使用"); return; }

        find.used = true;
        currentChance = find.count;
        userPrizes = [];
        prizes = JSON.parse(JSON.stringify(defaultPrizes));
        
        document.getElementById("lotteryBtn").disabled = false;
        document.getElementById("tip").innerText = `抽奖次数：${currentChance} 次`;
        document.getElementById("result").innerText = "可以开始抽奖";
        document.getElementById("allPrizes").innerText = "";
        renderPwd();
    }

    // ====================== 抽奖 ======================
    function doLottery() {
        if (currentChance <= 0) {
            document.getElementById("lotteryBtn").disabled = true;
            alert("次数用完"); return;
        }

        const random = Math.random() * 100;
        let currentRate = 0;
        let win = null;

        for (let p of prizes) {
            currentRate += p.rate;
            if (random <= currentRate) { win = p; break; }
        }

        currentChance--;
        userPrizes.push(win.name);
        document.getElementById("result").innerText = `你抽到：${win.name}`;
        document.getElementById("tip").innerText = `剩余次数：${currentChance}`;
        document.getElementById("allPrizes").innerText = "本轮奖品：" + userPrizes.join(" / ");
    }

    // ====================== 奖品管理 ======================
    function addPrize() {
        const name = document.getElementById("prizeName").value.trim();
        const rate = Number(document.getElementById("prizeRate").value);
        if (!name) return;
        defaultPrizes.push({ name, rate });
        renderPrize();
        document.getElementById("prizeName").value = "";
        document.getElementById("prizeRate").value = "";
    }

    function renderPrize() {
        const dom = document.getElementById("prizeList");
        dom.innerHTML = "";
        defaultPrizes.forEach((p, i) => {
            const item = document.createElement("div");
            item.className = "item";
            item.innerHTML = `${p.name} | 概率：${p.rate}% <button class="btn btn-danger" onclick="delPrize(${i})">删除</button>`;
            dom.appendChild(item);
        });
    }

    function delPrize(i) {
        defaultPrizes.splice(i, 1); renderPrize();
    }

    // ====================== 密码管理 ======================
    function createPwd() {
        const code = Math.random().toString(36).substring(2,8).toUpperCase();
        passwords.push({ code, count:1, used:false });
        renderPwd();
    }

    function renderPwd() {
        const dom = document.getElementById("pwdList");
        dom.innerHTML = "";
        passwords.forEach((p,i) => {
            const item = document.createElement("div");
            item.className = "item";
            item.innerHTML = `
                ${p.code} | 次数：<input type="number" value="${p.count}" style="width:60px" onchange="updateCount(${i},this.value)"> | ${p.used?"已用":"可用"}
                <button class="btn btn-danger" onclick="delPwd(${i})">删除</button>
            `;
            dom.appendChild(item);
        });
    }

    function updateCount(i, v) { passwords[i].count = Number(v)||1; }
    function delPwd(i) { passwords.splice(i,1); renderPwd(); }

    // ====================== 背景设置 ======================
    function setBackground() {
        bgImage = document.getElementById("bgUrl").value.trim();
        document.body.style.backgroundImage = bgImage ? `url(${bgImage})` : "none";
    }

    // ====================== 饼图 ======================
    function drawChart() {
        const ctx = document.getElementById("rateChart").getContext("2d");
        if(window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type:"pie",
            data:{
                labels: defaultPrizes.map(p=>p.name),
                datasets:[{data:defaultPrizes.map(p=>p.rate), backgroundColor:["#667eea","#764ba2","#ff4757","#ffa502","#2ed573"]}]
            }
        });
    }
</script>
</body>
</html>
